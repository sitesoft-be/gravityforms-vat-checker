name: Tests

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          tools: composer
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -not -path './plugin-update-checker/*' -print0 | xargs -0 -n1 php -l

      - run: vendor/bin/phpunit

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
